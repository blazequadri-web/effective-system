name: Deploy Wah! Taj site to GitHub Pages

on:
  push:
    branches: ["claude/fervent-curie-brm10h"]
    paths:
      - "wah-taj/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow this workflow to publish to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent Pages deployment at a time
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact (wah-taj as site root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./wah-taj

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
