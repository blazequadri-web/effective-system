name: Deploy Wah! Taj site to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/youthful-mendel-inem1o
    paths:
      - "wah-taj/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        # NOTE: Pages must be enabled once in repo Settings → Pages →
        # "Build and deployment" → Source: "GitHub Actions". The Actions
        # token in this environment cannot enable it automatically.
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish only the Wah! Taj static site as the Pages root.
          path: wah-taj

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
